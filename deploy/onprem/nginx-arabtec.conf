# /etc/nginx/sites-available/arabtec-workspace
# Plain HTTP on the internal network. No Cloudflare, no tunnel, no public DNS.
#
# Enable with:
#   ln -sf /etc/nginx/sites-available/arabtec-workspace /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

upstream arabtec_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Answers on the IP today. Add the internal hostname when DNS is ready:
    #   server_name dashboard.arabtec.local 10.20.0.9;
    server_name _;

    # Image uploads arrive base64-encoded inside a JSON body, which inflates a
    # 5 MB file to roughly 6.7 MB. Nginx defaults to 1 MB and would reject them.
    client_max_body_size 50m;

    # Long enough for a slow upload on a busy office network.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/arabtec-workspace.access.log;
    error_log  /var/log/nginx/arabtec-workspace.error.log;

    # Not public, but these cost nothing.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://arabtec_app;
        proxy_http_version 1.1;

        # The app calls app.set("trust proxy", 1) and reads these.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # Let the load balancer or monitoring hit this without touching the app UI.
    location = /health {
        proxy_pass http://arabtec_app;
        access_log off;
    }
}
